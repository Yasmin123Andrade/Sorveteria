{% extends 'base.html' %}
{% load static %}

{% block title %}Contact Us - Sorveteria{% endblock %}

{% block content %}
<!-- contact section start -->
<div class="contact_section layout_padding">
   <div class="container">
      <div class="row">
         <div class="col-md-4">
            <div class="contact_main">
               <h1 class="contact_taital">Contact Us</h1>
               <form action="" method="post">
                  {% csrf_token %}
                  <div class="form-group">
                     <input type="text" class="email-bt" placeholder="Name" name="name">
                  </div>
                  <div class="form-group">
                     <input type="email" class="email-bt" placeholder="Email" name="email">
                  </div>
                  <div class="form-group">
                     <input type="text" class="email-bt" placeholder="Phone Number" name="phone">
                  </div>
                  <div class="form-group">
                     <textarea class="massage-bt" placeholder="Message" rows="5" id="comment" name="message"></textarea>
                  </div>
                  <div class="main_bt"><button type="submit" style="background: none; border: none; color: inherit; font: inherit; cursor: pointer; width: 100%;">SEND</button></div>
               </form>
            </div>
         </div>
         <div class="col-md-8">
            <div class="location_text">
               <ul>
                  <li>
                     <a href="#">
                     <span class="padding_left_10 active"><i class="fa fa-map-marker" aria-hidden="true"></i></span>Making this the first true</a>
                  </li>
                  <li>
                     <a href="#">
                     <span class="padding_left_10"><i class="fa fa-phone" aria-hidden="true"></i></span>Call : +01 1234567890
                     </a>
                  </li>
                  <li>
                     <a href="#">
                     <span class="padding_left_10"><i class="fa fa-envelope" aria-hidden="true"></i></span>Email : demo@gmail.com
                     </a>
                  </li>
               </ul>
            </div>
            <div class="mail_main">
               <h3 class="newsletter_text">Newsletter</h3>
               <form action="" method="post">
                  {% csrf_token %}
                  <div class="form-group">
                     <input type="email" class="update_mail" placeholder="Enter Your Email" name="newsletter_email">
                     <div class="subscribe_bt"><button type="submit" style="background: none; border: none; color: inherit; font: inherit; cursor: pointer; width: 100%;">Subscribe</button></div>
                  </div>
               </form>
            </div>
            <div class="footer_social_icon">
               <ul>
                  <li><a href="#"><i class="fa fa-facebook" aria-hidden="true"></i></a></li>
                  <li><a href="#"><i class="fa fa-twitter" aria-hidden="true"></i></a></li>
                  <li><a href="#"><i class="fa fa-linkedin" aria-hidden="true"></i></a></li>
                  <li><a href="#"><i class="fa fa-instagram" aria-hidden="true"></i></a></li>
               </ul>
            </div>
         </div>
      </div>
   </div>
</div>
<!-- contact section end -->
{% endblock %}
