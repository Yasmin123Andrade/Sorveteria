```html
{% extends 'base.html' %}
{% load static %}

{% block title %}Detalhes do Produto | Sorveteria{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <main class="login-card">

        <div class="login-heading">

            <span class="login-mark">S</span>

            <p class="eyebrow">SORVETERIA GELATO</p>

            <h1>Detalhes do Produto</h1>

            <p class="subtitle">
                Confira as informações do produto.
            </p>

        </div>

        <div class="login-form">

            <label>ID</label>
            <input type="text" value="{{ produto.pk }}" readonly>

            <label>Descrição</label>
            <input type="text" value="{{ produto.descricao }}" readonly>

            <label>Preço</label>
            <input type="text" value="R$ {{ produto.valor }}" readonly>

            <a href="{% url 'editar_produto' produto.pk %}"
               style="text-decoration: none;">
                <button type="button">Editar</button>
            </a>

            <a href="{% url 'lista_produtos' %}"
               style="text-decoration: none;">
                <button type="button">Voltar</button>
            </a>

        </div>

    </main>
</div>
{% endblock %}
```
