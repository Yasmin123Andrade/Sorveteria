{% extends 'base.html' %}
{% block title %}Novo produto | Sorveteria Gelato{% endblock %}
{% block content %}<main class="page-shell"><div class="container"><div class="page-heading"><div><span class="section-kicker">Catalogo</span><h1>Novo produto</h1><p>Adicione um sabor ao cardapio.</p></div></div><section class="form-card"><form method="post"><div class="form-grid">{% csrf_token %}{% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="form-actions"><a href="{% url 'lista_produtos' %}" class="btn-app-secondary">Cancelar</a><button type="submit" class="btn-app">Salvar produto</button></div></form></section></div></main>{% endblock %}
