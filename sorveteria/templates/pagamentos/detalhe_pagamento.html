```html
{% extends 'base.html' %}
{% load static %}

{% block title %}Detalhes do Pagamento | Sorveteria{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <main class="login-card">

        <div class="login-heading">

            <span class="login-mark">S</span>

            <p class="eyebrow">SORVETERIA GELATO</p>

            <h1>Detalhes do Pagamento</h1>

            <p class="subtitle">
                Confira as informações do pagamento.
            </p>

        </div>

        <div class="login-form">

            <label>ID</label>
            <input type="text" value="{{ pagamento.pk }}" readonly>

            <label>Pedido</label>
            <input type="text"
                   value="{{ pagamento.pedido }}"
                   readonly>

            <label>Forma de pagamento</label>
            <input type="text"
                   value="{{ pagamento.forma_pagamento }}"
                   readonly>

            <label>Valor total</label>
            <input type="text"
                   value="R$ {{ pagamento.valor_total }}"
                   readonly>

            <a href="{% url 'editar_pagamento' pagamento.pk %}"
               style="text-decoration: none;">

                <button type="button">
                    Editar
                </button>

            </a>

            <a href="{% url 'lista_pagamentos' %}"
               style="text-decoration: none;">

                <button type="button">
                    Voltar
                </button>

            </a>

        </div>

    </main>
</div>
{% endblock %}
```
