{% extends 'base.html' %}
{% load static %}

{% block title %}Cadastrar Pessoa - Sorveteria{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/forms.css' %}">{% endblock %}

{% block content %}
<main class="container my-5"><div class="row justify-content-center"><div class="col-lg-10 col-xl-9"><section class="card-romyk-form"><header class="card-romyk-header"><h1 class="title-romyk">Cadastrar Nova Pessoa</h1><p class="subtitle-romyk">Preencha os dados abaixo para concluir o registro</p></header><div class="card-body p-4 p-md-5"><form method="post" novalidate>{% csrf_token %}<div class="romyk-grid-form">{{ form.as_p }}</div><div class="form-actions"><a href="{% url 'lista_pessoas' %}" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn-romyk-submit"><i class="fa fa-save mr-2"></i>Salvar Registro</button></div></form></div></section></div></div></main>
{% endblock %}
