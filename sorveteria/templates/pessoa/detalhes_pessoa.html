```html
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes da Pessoa | Sorveteria</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body class="login-page">

    <main class="login-card">

        <div class="login-heading">

            <span class="login-mark">S</span>

            <p class="eyebrow">SORVETERIA GELATO</p>

            <h1>Detalhes da Pessoa</h1>

            <p class="subtitle">
                Confira as informações cadastradas.
            </p>

        </div>

        <div class="login-form">

            <label>Nome</label>
            <input type="text" value="{{ pessoa.nome }}" readonly>

            <label>CPF</label>
            <input type="text" value="{{ pessoa.cpf }}" readonly>

            <label>Email</label>
            <input type="text" value="{{ pessoa.email }}" readonly>

            <label>Telefone</label>
            <input type="text" value="{{ pessoa.telefone }}" readonly>

            <a href="{% url 'editar_pessoa' pessoa.pk %}"
               style="text-decoration: none;">
                <button type="button">Editar</button>
            </a>

            <a href="{% url 'lista_pessoas' %}"
               style="text-decoration: none;">
                <button type="button">Voltar</button>
            </a>

        </div>

    </main>

</body>

</html>
