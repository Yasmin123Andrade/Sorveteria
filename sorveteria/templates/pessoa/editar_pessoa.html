{% extends 'base.html' %}
{% block title %}Editar pessoa | Sorveteria Gelato{% endblock %}
{% block content %}<main class="page-shell"><div class="container"><section class="form-card"><span class="section-kicker">Cadastro</span><h1>Editar pessoa</h1><form method="post"><div class="form-grid">{% csrf_token %}{% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="form-actions"><a href="{% url 'detalhe_pessoa' pessoa.pk %}" class="btn-app-secondary">Cancelar</a><button type="submit" class="btn-app">Salvar alteracoes</button></div></form></section></div></main>{% endblock %}
