<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
</head>
<body>
    <h1>Produtos Cadastrados</h1>
    <a href="{% url 'criar_produto' %}">Cadastrar Novo Produto</a>
    <ul>
        {% for produto in produtos %}
            <li>{{ produto.descricao }} - R$ {{ produto.valor }}</li>
        {% empty %}
            <li>Nenhum produto cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
