{% extends 'base.html' %}
{% block title %}Novo pedido | Sorveteria Gelato{% endblock %}
{% block content %}<main class="page-shell"><div class="container"><section class="form-card"><span class="section-kicker">Atendimento</span><h1>Novo pedido</h1><p>Registre os dados do pedido.</p><form method="post"><div class="form-grid">{% csrf_token %}{% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="form-actions"><a href="{% url 'lista_produtos' %}" class="btn-app-secondary">Cancelar</a><button type="submit" class="btn-app">Salvar pedido</button></div></form></section></div></main>{% endblock %}
